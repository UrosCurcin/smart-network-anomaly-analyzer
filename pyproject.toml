[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-network-anomaly-analyzer"
version = "0.1.0"
description = "Machine Learning based network anomaly detection pipeline"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.5.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",  # used by tests (FastAPI's TestClient), not at runtime
]

[project.scripts]
sn-analyzer = "sn_analyzer.cli:main"
sn-analyzer-api = "sn_analyzer.api_main:main"